name: "ssh-agent"
description: "Setup SSH agent for basic CI/CD operations."

inputs:
  key:
    description: "Private key to load"
    required: true

  host:
    description: "Config pattern"
    default: "*"

  user:
    description: "Default user"
    default: "admin"

  port:
    description: "Default port"
    default: "22"

  insecure:
    description: "Disable host key checking"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup agent
      id: agent
      shell: bash
      env:
        SSH_PRIV_KEY: ${{ inputs.key }}
      run: |
        set -euo pipefail
        eval "$(ssh-agent -s)"
        printf '%s' "$SSH_PRIV_KEY" | tr -d '\r' | ssh-add - > /dev/null
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        ssh-add -l 2>&1 > /dev/null

    - name: Setup config
      id: config
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        SSH_PORT: ${{ inputs.port }}
        SSH_INSECURE: ${{ inputs.insecure }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        {
          echo "Host ${SSH_HOST}"
          echo "  User ${SSH_USER}"
          echo "  Port ${SSH_PORT}"
          echo "  BatchMode yes"
          echo "  IdentitiesOnly no"
          echo "  PasswordAuthentication no"
          if [ "${SSH_INSECURE}" = "true" ]; then
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
          fi
        } > ~/.ssh/config
        chmod 600 ~/.ssh/config

branding:
  icon: "lock"
  color: "blue"
